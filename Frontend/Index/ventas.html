<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../Imagenes/Logo.png">
    <link rel="stylesheet" href="../Style/estiloVentas.css">
    <link rel="stylesheet" href="../Style/global.css">
    <title>Ventas</title>
</head>
<body id="page-ventas">
    <div id="sidebar-container"></div>
    <div id="header-container"></div>
    <div class="main-wrapper">
        <main class="main">
            <section class="nueva-venta">
                <div class="card-header">
                    <div class="titulo">
                        <h2>Nueva venta</h2>
                    </div>
                    <div class="instruccion">Selecciona un cliente y agrega producto</div>
                </div>
                <div class="form-ventas">
                    <div class="campo-form cliente">
                        <label for="cliente">cliente</label>
                        <div class="select-box">
                            <select id="cliente">
                                <option value="">Cargando</option>
                            </select>
                        </div>
                    </div>
                    <div class="campo-form producto">
                        <label for="producto">Producto</label>
                        <select id="producto">
                            <option value="">Cargando producto...</option>
                        </select>
                    </div>
                    <div class="campo-form cantidad">
                        <label for="cantidad">cantidad</label>
                        <input type="number" id="cantidad" value="1" min="1" step="1">
                    </div>
                    <div class="campo-form pecio">
                        <label for="precio">Precio unitario</label>
                        <input type="text" id="precio" placeholder="₡0" readonly>
                    </div>
                </div>
                <button type="button" class="btnFactura" id="btn-factura">Registrar venta</button>
                <div class="productos-populares">
                    <div class="popular-titulo">
                        Productos más vendidos
                    </div>
                    <div id="productos-populares-lista"></div>
                </div>
            </section>
            <section class="resumen-seccion">
                <div class="resumen-card">
                    <div class="resumen-titulo">
                        <h2>Resumen de ventas</h2>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Precio unitario</th>
                                <th>Subtotal</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-venta"></tbody>
                    </table>
                    <button type="button" id="btn-agregar" class="btn-agregar">+ Agregar producto</button>
                    <div class="total-card">
                        <h3 class="total-linea">
                            <span>Subtotal</span>
                            <strong id="subtotal-venta">₡0</strong>
                        </h3>
                    </div>
                    <div class="total-linea">
                        <span>Impuestos</span>
                        <strong id="iva-venta">No configurado</strong>
                    </div>
                </div>
                <div class="total-final">
                    <span>Total</span>
                    <strong id="total-venta">₡0</strong>
                </div>
            </section>
            <div class="mensaje-exitoso" id="contenedor-mensaje" hidden>
                <span id="mensaje-venta"></span>
                <button type="button" id="cerrar-mensaje">X</button>
            </div>
        </main>
    </div>
    <button id="btn-abrir-chat" class="chat-trigger">
        <img src="../Imagenes/octopus1.png" alt="Chat" style="width:30px;">
    </button>
    <div id="ventana-chat" class="chat-window oculta">
        <div class="chat-header">
            <div class="header-perfil">
                <div class="avatar">
                    <img src="../Imagenes/octopus.png" alt="asistente">
                </div>
                <div class="info">
                    <h3>Asistente de Inventario</h3>
                    <span class="estado">Asistente</span>
                </div>
            </div>
            <button type="button" id="btn-cerrar-chat" class="btn-cerrar">X</button>
        </div>
        <div class="chat-mensajes" id="chat-mensajes"></div>
        <div class="chat-input-container">
            <input type="text" id="chat-input" placeholder="Pregunta sobre el stock">
            <button type="button" id="btn-evniar-chat" class="btn-enviar">></button>
        </div>
    </div>
    <script src="../JavaScript/layout.js"></script>
    <script src="../JavaScript/chat.js"></script> 
    <script src="../JavaScript/ventas.js"></script>
</body>
</html>
