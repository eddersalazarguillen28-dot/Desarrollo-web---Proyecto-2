<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas</title>

    <link rel="stylesheet" href="../Style/global.css">
    <link rel="stylesheet" href="../Style/estiloVentas.css">
    <link rel="icon" type="img/jpeg" href="../Imagenes/logoVentana.jpeg">
</head>
<body id="page-ventas">
    <div id="sidebar-container"></div>
    <div id="header-container"></div>

    <div class="main-wrapper">
        <main class="main">

            <h1>Registrar Venta</h1>

            <p>Selecciona un cliente y agrega los productos de la venta</p>

            <section class="nueva-venta">
                <h2>Nueva venta</h2>
                <div class="form-ventas">
                    <div class="campo-form">
                        <label for="cliente">Cliente</label>

                        <section id="cliente">
                            <option value="">Cargando clientes...</option>
                        </section>
                    </div>

                    <div class="campo-form">
                        <label for="cantidad">cantidad</label>

                        <input type="number" id="cantidad" value="1" min="1">
                    </div>
                </div>

                <button type="button" id="btn-agregar" class="btn-agregar">+ Agregar al carrito</button>
            </section>

            <section class="resumen-seccion">
                <h2>Resumen de la venta</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Subtotal</th>
                            <th>Acción</th>
                        </tr>
                    </thead>

                    <tbody id="cuerpo-venta"></tbody>
                </table>

                <div class="total-card">
                    <p>Subtotal: 
                        <strong id="subtotal-venta">
                            ₡0
                        </strong>
                    </p>

                    <p>Impuestos:
                        <strong id="iva-venta">
                            No configurar
                        </strong>
                    </p>
                    
                    <h2>
                        Total:
                        <strong id="total-venta">
                            ₡0
                        </strong>
                    </h2>
                </div>

                <button type="button" id="btn-factura" class="btnFactura">
                    Registrar venta
                </button>
            </section>
            
            <div id="contenedor-mensaje" class="mensaje-venta" hidden>
                <span id="mensaje-venta"></span>
                <button type="button" id="cerrar-mensaje">
                    X
                </button>
            </div>
        </main>
    </div>

    <script src="../JavaScript/layout.js"></script>
    <script src="../JavaScript/ventas.js"></script>
    
</body>
</html>
