<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../Imagenes/logoVentana.jpeg">
    <link rel="stylesheet" href="../Style/estiloProductos.css">
    <link rel="stylesheet" href="../Style/global.css">
    <title>Productos</title>
</head>
<body id="page-productos">
    <div id="sidebar-container"></div>
    <div id="header-container"></div>
    
    <div class="main-wrapper">
        <main class="main">
            <section class="seccion-productos">
                <div class="contenedorTitulo">
                    <h2>Catalogo</h2>
                </div>

                <!--Buscador-->
                <div class="contenedor-buscador">
                    <input type="text" id="buscador-productos" placeholder="Buscar producto...">
                </div>

                <!-- Contenedor dinámico de Cards -->
                <div class="grid-productos" id="grid-productos">
                    <!-- Las tarjetas se insertarán aquí con JavaScript -->
                </div>

                <!--Pie de tabla-->
                <div class="footer-tabla">
                    <span id="contador-productos">Cargando productos...</span>

                    <div class="btnPaginas">
                        <button>&lt;</button>
                        <button>1</button>
                        <button>&gt;</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!--Pie de pagina de producto (Modal)-->
    <div id="modal-producto" class="modal-overlay">
        <div class="modal-content">
            <span class="cerrar-modal" onclick="cerrarModal()">✕</span>

            <div class="modal-header">
                <img id="modal-img" src="" alt="Producto" class="modal-imagen" style="object-fit: contain;">
                <h2 id="modal-titulo">Nombre</h2>
                <span id="modal-categoria" class="modal-categoria-badge">Categoría</span>
            </div>

            <div class="modal-body">
                <h3>Especificaciones</h3>
                <p id="modal-desc">Aquí van los detalles del producto.</p>

                <div class="modal-precio-box">
                    <span>Precio de venta:</span>
                    <strong id="modal-precio">₡0.00</strong>
                </div>
            </div>
        </div>
    </div>

    <!-- Botón y Ventana de Chat -->
    <button id="btn-abrir-chat" class="chat-trigger">
      <img src="../Imagenes/octopus1.png" alt="Chat" style="width:30px;">
    </button>

    <div id="ventana-chat" class="chat-window oculta">
      <div class="chat-header">
        <div class="header-perfil">
          <div class="avatar"><img src="../Imagenes/octopus.png" alt="Avatar"></div>
          <div class="info">
            <h3>Asistente de Inventario <span>x Gemini</span></h3>
            <span class="estado">● Conectado</span>
          </div>
        </div>
        <button id="btn-cerrar-chat" class="btn-cerrar">✕</button>
      </div>

      <div class="chat-mensajes" id="chat-mensajes">
        <div class="mensaje bot">
          <div class="burbuja">
            He analizado las ventas recientes y el inventario actual. ¿En qué te puedo ayudar hoy?
          </div>
        </div>
      </div>

      <div class="chat-input-container">
        <input type="text" id="chat-input" placeholder="Pregunta sobre tu stock...">
        <button id="btn-enviar-chat" class="btn-enviar">➤</button>
      </div>
    </div>

    <!-- Vinculación de scripts -->
    <script src="../JavaScript/layout.js"></script>
    <script src="../JavaScript/chat.js"></script> 
    <script src="../JavaScript/productos.js"></script>
</body>
</html>
