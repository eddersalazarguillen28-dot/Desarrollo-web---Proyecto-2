<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="../Imagenes/logoVentana.jpeg">
    <link rel="stylesheet" href="../Style/estiloInicio.css">
    <title>Inicio - OctoERP Tech Store</title>
</head>
<body>

    <!--Contenedor central-->
    <main class="contenedor-centro">
      <div class="bienvenida">
        <img src="../Imagenes/logoLinea.png" alt="Logo de la empresa" id="logo-centro">
        <h1>Bienvenido al sistema</h1>
        <p>Selecciona un modulo</p>
      </div>
       <div class="grid-menu">
        
        <a href="clientes.html" class="btn-menu">Clientes</a>
        <a href="ventas.html" class="btn-menu">Ventas</a>
        <a href="inventario.html" class="btn-menu">Inventario</a>
        <a href="dashboard.html" class="btn-menu">Dashboard</a>
        <a href="reportes.html" class="btn-menu">Reportes</a>
       
      </div>
    </main>

    <script src="../JavaScript/layout.js"></script>
    
    <!-- Script para ocultar opciones al vendedor -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const usuarioGuardado = localStorage.getItem("usuario");
            if (!usuarioGuardado) return;

            try {
                const usuario = JSON.parse(usuarioGuardado);
                const rol = (usuario.rol || usuario.rango || "").toLowerCase();

                if (rol === "vendedor") {
                    // Ocultar la tarjeta de Dashboard
                    const btnDashboard = document.querySelector('.grid-menu a[href="dashboard.html"]');
                    if (btnDashboard) btnDashboard.style.display = "none";

                    // Ocultar la tarjeta de Inventario
                    const btnInventario = document.querySelector('.grid-menu a[href="inventario.html"]');
                    if (btnInventario) btnInventario.style.display = "none";
                    
                    // Ocultar la tarjeta de Reportes (si el vendedor no debe verla)
                    const btnReportes = document.querySelector('.grid-menu a[href="reportes.html"]');
                    if (btnReportes) btnReportes.style.display = "none";
                }
            } catch (e) {
                console.error("Error al leer los datos del usuario:", e);
            }
        });
    </script>
</body>
</html>
