<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="../dashboard/Imagenes/logoVentana.jpeg">
    <link rel="stylesheet" href="estiloInicio.css">
    <title>Inicio</title>
</head>
<body>

    <!--Contenedor central-->
    <main class="contenedor-centro">

        <div class="bienvenida">
            <img src="Imagenes/logoLinea.png" alt="Logo de la empresa" id="logo-centro">
            <h1>Bienvenido al sistema</h1>
            <p>Selecciona un modulo</p>
        </div>
        <div class="grid-menu">
            <a href="productos.html" class="btn-menu">Productos</a>
            <a href="inventario.html" class="btn-menu">Inventario</a>
            <a href="clientes.html" class="btn-menu">Clientes</a>
            <a href="ventas.html" class="btn-menu">Ventas</a>
            <a href="../dashboard/index.html" class="btn-menu">Dashboard</a>
            <a href="" class="btn-menu">Reportes</a>
        </div>

    </main>

    <button id="btn-abrir-chat" class="chat-trigger">
        <img src="Imagenes/octopus1.png" alt="Chat" style="width: 30px;">
    </button>

    <!-- Ventana del Asistente -->
    <div id="ventana-chat" class="chat-window oculta">
      <div class="chat-header">
        <div class="header-perfil">
          <div class="avatar"><img src="Imagenes/octopus.png"></div>
          <div class="info">
            <h3>Asistente de Inventario <span>x Gemini</span></h3>
            <span class="estado">● Conectado</span>
          </div>
        </div>
        <button id="btn-cerrar-chat" class="btn-cerrar">✕</button>
      </div>

      <div class="chat-mensajes" id="chat-mensajes">
        <div class="mensaje bot">
          <div class="burbuja">
            He analizado las ventas recientes y el inventario actual. ¿En qué te puedo ayudar hoy?
          </div>
        </div>
      </div>

      <div class="chat-input-container">
        <input type="text" id="chat-input" placeholder="Pregunta sobre tu stock...">
        <button id="btn-enviar-chat" class="btn-enviar">➤</button>
      </div>
    </div>
    <!-- Vinculación del script del chat -->
    <script src="chat.js"></script> 
</body>
</html>
