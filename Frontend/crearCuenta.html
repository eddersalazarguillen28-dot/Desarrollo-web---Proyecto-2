<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Document</title>
</head>
<body>
    <div id="contenedorCuenta">
        <img src="Imagenes/Logo.png" alt="logo">
        <h3>Regístrate</h3>
        <p class="subtitulo">Crea una cuenta para continuar</p>

        <form>

            <div class="grupoInput">
                <input type="text" id="name" placeholder="Nombre" required>
            </div>

            <div class="grupoInput">
                <input type="email" id="email" placeholder="Correo electrónico" required>
            </div>

            <div class="grupoInput">
                <input type="password" id="contrasena" placeholder="Contraseña"required>
            </div>
            <br>

            <button type="submit" class="btnIngresar">Crear cuenta</button>

        </form>

        <p id="preguntaCuenta">¿Ya tienes una cuenta?</p>
        <a href="#" class="crearCuenta">Iniciar sesión</a>

    </div>
</body>
</html>
