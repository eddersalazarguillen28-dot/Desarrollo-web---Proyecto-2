<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Document</title>
</head>
<body>
    <div id="contenedor">
        <img src="Imagenes/Logo.png" alt="logo">
        <h3>Iniciar sesión</h3>
        <p class="subtitulo">Accede a tu cuenta para continuar</p>

        <form id="inicioSesion" novalidate>

            <div class="grupoInput">
                <input type="email" id="email" placeholder="Correo electrónico" required>
                <span class="error-message" id="errorEmail"></span>
            </div>

            <div class="grupoInput">
                <input type="password" id="contrasena" placeholder="Contraseña"required>
                <span class="error-message" id="errorContrasena"></span>
            </div>

            <div class="contraOlvidada">
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btnIngresar">Ingresar</button>

        </form>

        <a href="crearCuenta.html" class="crearCuenta">Crear cuenta</a>

    </div>
    <script src="validacionesSesion.js"></script>
    
</body>
</html>
